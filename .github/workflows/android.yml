name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile and test
        working-directory: android-app
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PixelSheetConverter-Android-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelSheetConverter-Android-test
          path: PixelSheetConverter-Android-test.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          files: PixelSheetConverter-Android-test.apk
          prerelease: true
          generate_release_notes: true
