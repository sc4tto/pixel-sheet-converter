name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm PixelSheetConverter.spec
      - shell: pwsh
        run: |
          Copy-Item README.md "dist/PixelSheetConverter/LEGGIMI.txt"
          Copy-Item crea_collegamento_desktop.bat "dist/PixelSheetConverter/Crea collegamento sul desktop.bat"
          Compress-Archive -Path "dist/PixelSheetConverter/*" -DestinationPath "dist/PixelSheetConverter-Windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/PixelSheetConverter-Windows-x64.zip
          generate_release_notes: true
